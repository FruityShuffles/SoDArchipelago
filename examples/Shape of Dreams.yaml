# Configuration reference for Shape of Dreams. Edit these settings, then put this file in Archipelago's Players folder.
# Each setting gives its accepted values and default. Values shown are the defaults.
# For gameplay explanations and option interactions, read:
# https://github.com/FruityShuffles/SoDArchipelago/blob/main/apworld/shape_of_dreams/docs/en_Shape%20of%20Dreams.md#options

name: YourName
game: Shape of Dreams
requires:
  version: 0.6.4

Shape of Dreams:
  # Minimum winning difficulty for the goal. Values: deep_sleep, ominous_dream, nightmare. Default: nightmare.
  goal_difficulty: nightmare

  # Number of different Travelers needed for the goal. Integer: 1-9. Default: 9.
  goal_traveler_count: 9

  # Useful "Mastery: <Traveler>" items per Traveler. Integer: 0-15. Default: 8. 0 removes these items.
  mastery_packs_per_traveler: 8

  # Mastery levels granted by each Mastery item. Integer: 1-40. Default: 5.
  mastery_pack_value: 5

  # Mastery earned from runs. Values: true, false. Default: true. false leaves only Mastery items.
  passive_mastery: true

  # Total Stardust divided across the seed's Stardust items. Integer: 0-1000000. Default: 54000.
  stardust_total: 54000

  # Map Blessings and Treasures in additional slots. Values: true, false. Default: false. Solo/host delivery.
  in_run_items: false

  # Curse traps in about 20% of additional slots. Values: true, false. Default: false. Solo/host delivery.
  # Independent of in_run_items.
  traps: false

  # Jonas's Archipelago ware checks. Integer: 0-100. Default: 30. Solo/host purchases; 0 disables them.
  jonas_wares: 30

  # Evil dreams forced until their release items arrive. YAML list of exact names; [] selects none. Default: [].
  # Accepted names and effects:
  # "Fish Scales": Monster damage also lowers your maximum health until the next world.
  # "Grievous Wounds": Halves healing and shields on Travelers.
  # "Mad Life": Monsters predict your movement.
  # "Marsh of Destiny": Each world offers a Seed of Torment shrine: rewards for strengthening monsters.
  # "Overpopulation": Adds 50% more monsters, excluding bosses.
  # "Prudent Jellyfish": Weakens cooldown reduction and limits how much cooldowns can be shortened.
  forced_evil_lucid_dreams: []
  # For example: forced_evil_lucid_dreams: ["Grievous Wounds", "Overpopulation"]

  # Chaotic dreams forced until their release items arrive. YAML list of exact names; [] selects none. Default: [].
  # Accepted names and effects:
  # "Embrace Mortality": Travelers and monsters deal double damage.
  # "Harmless Whispers": Bosses can be crowd-controlled, but gain health, damage, tenacity
  #   and shields against repeated control.
  # "Sparkling Dream Flask": Health potions and Guidance shrines give Dream Dust instead of healing.
  # "The Darkest Urge": Monsters fight each other and grow stronger when they kill another monster.
  # "WILD": Every monster except bosses is a Hunter.
  forced_chaotic_lucid_dreams: []
  # For example: forced_chaotic_lucid_dreams: ["WILD"]

  # Shuffle constellation mastery requirements. Values: true, false. Default: true.
  shuffle_star_requirements: true

  # Share knockdowns through DeathLink. Values: true, false. Default: false. Receiving requires solo/hosting.
  death_link: false

  # Optional Archipelago location settings. YAML lists of exact location names or group names; default: [].
  # Uncomment and edit to use. exclude_locations prevents progression and useful items on those checks.
  # priority_locations requests progression there; exclusions override priorities.
  # exclude_locations: [Nightmare]
  # priority_locations: [Aurena]
  # Groups: Achievements, World Clears, Build-Dependent Achievements, Souvenirs, Jonas's Wares, Shrines,
  # Quests, Artifacts, Deep Sleep, Ominous Dream, Nightmare, Aurena, Bismuth, Cetus, Lacerta, Mist, Nachia,
  # Shell, Vesper, Yubar.
  # For a solo seed, leave at least 93 + 9 * mastery_packs_per_traveler non-excluded checks (165 by default).

# Named presets: copy these lines over the corresponding defaults above.
# Default:
#   in_run_items: false
#   traps: false
# With in-run items:
#   in_run_items: true
#   traps: false
# With in-run items and traps:
#   in_run_items: true
#   traps: true
